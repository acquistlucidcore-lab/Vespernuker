name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install
        run: pip install -r requirements.txt pyinstaller

      - name: build exe
        run: pyinstaller --onefile --name NXR_NUKER --noconfirm nxr_nuker.py

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: NXR_NUKER
          path: dist/NXR_NUKER.exe
