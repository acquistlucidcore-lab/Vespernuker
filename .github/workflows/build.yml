name: Build NXR NUKER

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --onefile --console --name NXR --clean --noconfirm --collect-all aiohttp --collect-all certifi --collect-all charset_normalizer --collect-all multidict --collect-all yarl --collect-all frozenlist --collect-all aiosignal --collect-all attr main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NXR-NUKER
          path: dist/NXR.exe
