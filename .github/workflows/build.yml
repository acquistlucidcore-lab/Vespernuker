name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade discord.py aiohttp
          pip install pyinstaller
          pip list

      - name: build exe
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --noconfirm `
            --clean `
            --name NXR_NUKER `
            --hidden-import discord `
            --hidden-import discord.ext.commands `
            --hidden-import discord.ext.tasks `
            --hidden-import aiohttp `
            --hidden-import aiohttp.client `
            --hidden-import aiohttp.connector `
            --collect-submodules discord `
            --collect-submodules aiohttp `
            --copy-metadata discord.py `
            --copy-metadata aiohttp `
            nxr_nuker.py

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: NXR_NUKER
          path: dist/NXR_NUKER.exe
          if-no-files-found: error
