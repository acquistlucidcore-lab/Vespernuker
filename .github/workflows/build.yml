# .github/workflows/build.yml
name: Build NXR NUKER PROTOCOL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NXR_NUKER_PROTOCOL-windows
            sep: ";"
          - os: ubuntu-latest
            artifact: NXR_NUKER_PROTOCOL-linux
            sep: ":"
          - os: macos-latest
            artifact: NXR_NUKER_PROTOCOL-macos
            sep: ":"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required files
        shell: bash
        run: |
          echo "--- repo root ---"
          ls -la
          missing=0
          for f in nxr_nuker_protocol.py requirements.txt config.yml; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing from repo root"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "one or more required files are missing — aborting"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --console \
            --name "NXR_NUKER_PROTOCOL" \
            --add-data "config.yml${{ matrix.sep }}." \
            nxr_nuker_protocol.py

      - name: Show dist
        shell: bash
        run: ls -la dist/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/NXR_NUKER_PROTOCOL.exe
            dist/NXR_NUKER_PROTOCOL
            config.yml
            README.txt
          if-no-files-found: warn
