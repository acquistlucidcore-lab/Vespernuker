# .github/workflows/build.yml
name: Build NXR NUKER PROTOCOL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NXR_NUKER_PROTOCOL-windows
            sep: ";"
          - os: ubuntu-latest
            artifact: NXR_NUKER_PROTOCOL-linux
            sep: ":"
          - os: macos-latest
            artifact: NXR_NUKER_PROTOCOL-macos
            sep: ":"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --console \
            --name "NXR_NUKER_PROTOCOL" \
            --add-data "config.yml${{ matrix.sep }}." \
            nxr_nuker_protocol.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/NXR_NUKER_PROTOCOL.exe
            dist/NXR_NUKER_PROTOCOL
            config.yml
            README.txt
          if-no-files-found: warn
